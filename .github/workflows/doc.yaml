name: doc

# Builds the three LaTeX documents of src/rsoc8/doc (specification, datasheet, verification report) and
# uploads the PDFs as an artifact. The Tiny Tapeout project page is built by the workflow "docs".
on:
  push:
    paths:
      - 'src/rsoc8/doc/**'
      - '.github/workflows/doc.yaml'
  workflow_dispatch:

jobs:
  doc:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install LaTeX
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science

      - name: Build the documents
        shell: bash
        run: |
          cd src/rsoc8/doc
          latexmk -pdf -interaction=nonstopmode -halt-on-error rpe_spec.tex rpe_datasheet.tex rpe_verification.tex

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: documents
          path: |
            src/rsoc8/doc/rpe_spec.pdf
            src/rsoc8/doc/rpe_datasheet.pdf
            src/rsoc8/doc/rpe_verification.pdf
