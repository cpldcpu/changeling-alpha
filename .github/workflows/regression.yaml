name: regression

# Regression of the portable tree src/rsoc8 (not part of the Tiny Tapeout template):
# block suites against their models and the firmware tests of the whole chip.
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/regression.yaml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install simulator and compiler
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-avr avr-libc binutils-avr

      - name: Run the suites
        shell: bash
        run: sh src/rsoc8/tests/ci.sh

      - name: Upload logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-logs
          path: src/rsoc8/build/ci/*.txt
